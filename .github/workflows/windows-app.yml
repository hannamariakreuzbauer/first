name: Windows-App

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install ".[outlook,test]" pyinstaller
      - name: Tests
        run: python -m pytest -q
      - name: LV-Tool.exe bauen
        run: >
          pyinstaller --noconfirm --onefile --windowed --name LV-Tool --paths .
          --add-data "lvtool/ui.html;lvtool"
          --add-data "lvtool/profil_vorlagen;lvtool/profil_vorlagen"
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import xlrd --hidden-import tkinter --hidden-import tkinter.filedialog
          packaging/start.py
      - name: Selbsttest der fertigen LV-Tool.exe
        shell: pwsh
        run: |
          $ziel = Join-Path $env:RUNNER_TEMP "selbsttest.json"
          $p = Start-Process -FilePath "dist\LV-Tool.exe" -ArgumentList "--selbsttest", $ziel -Wait -PassThru
          if (Test-Path $ziel) { Get-Content $ziel } else { Write-Host "kein Ergebnis geschrieben" }
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: LV-Tool-Windows
          path: dist/LV-Tool.exe
      - name: Als Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import lvtool; print(lvtool.__version__)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/LV-Tool.exe" --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag "dist/LV-Tool.exe" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LV-Tool $tag" --notes "Windows-App. LV-Tool.exe herunterladen und doppelklicken. Beim ersten Start: Weitere Informationen, dann Trotzdem ausführen."
          }
          exit 0
