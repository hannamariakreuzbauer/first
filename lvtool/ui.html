<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LV-Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#dde1e7;--acc:#1f5fbf;--acc2:#e8f0fc;--ok:#1a7f4b;--warn:#b76e00;--bad:#b42318;--warnbg:#fff4de;--badbg:#fde8e6;--okbg:#e4f5ec}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#182233;color:#fff}
header h1{font-size:16px;margin:0;font-weight:600}
header .pfad{color:#b8c2d3;font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:#b9c0cc;background:#fafbfc}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:#184e9e}
button.klein{padding:3px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
header button{background:transparent;color:#fff;border-color:#4a5873}
header button:hover{background:#26334a}
.wrap{flex:1;display:flex;min-height:0}
nav{width:250px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
nav .sem{font-weight:600;margin:12px 6px 4px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer}
nav a:hover{background:#f1f3f6}
nav a.akt{background:var(--acc2);color:var(--acc);font-weight:600}
nav a small{display:block;color:var(--mut);font-weight:400}
nav .sem a.semlink{display:inline;float:right;padding:0 4px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--acc);font-size:12px}
nav .neu{margin-top:14px;display:flex;flex-direction:column;gap:6px}
main{flex:1;overflow:auto;padding:18px 22px;min-width:0}
h2{margin:0 0 2px;font-size:20px}
.sub{color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut)}
.tabs a.akt{color:var(--acc);border-color:var(--acc);font-weight:600}
.badge{display:inline-block;min-width:20px;text-align:center;padding:0 6px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:600;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kachel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kachel b{display:block;font-size:24px;font-weight:600}
.kachel span{color:var(--mut);font-size:12.5px}
.kachel.warn b{color:var(--warn)} .kachel.ok b{color:var(--ok)}
.zeile{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0;background:#fff}
td.z{text-align:right;font-variant-numeric:tabular-nums}
td.neg{background:var(--badbg)} td.off{background:var(--warnbg)}
.tabelle td:first-child{min-width:230px}
.tabelle{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 260px)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef0f3}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)}
.frage p{margin:0 0 10px;white-space:pre-wrap}
.frage .opt{display:flex;flex-wrap:wrap;gap:6px}
.frage .kat{float:right;color:var(--mut);font-size:12px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
form.f{display:grid;grid-template-columns:220px 1fr;gap:9px 14px;align-items:center;max-width:820px}
form.f label{color:var(--mut)} form.f small{grid-column:2;color:var(--mut);margin-top:-6px}
.split{display:grid;grid-template-columns:270px 1fr;gap:12px;height:calc(100vh - 270px);min-height:320px}
.liste{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}
.liste a{display:block;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.liste a.akt{background:var(--acc2)} .liste a small{color:var(--mut);display:block}
iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.hinweis{background:var(--warnbg);border:1px solid #f2d59a;color:#6b4300;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.fehler{background:var(--badbg);border-color:#f3b7b1;color:var(--bad)}
.leer{color:var(--mut);padding:30px;text-align:center}
dialog{border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:640px;width:92%}
dialog::backdrop{background:rgba(20,28,40,.45)}
#toast{position:fixed;right:18px;bottom:18px;background:#182233;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:480px;z-index:9}
#toast.fehler{background:var(--bad)}
.start{max-width:620px;margin:8vh auto;text-align:center}
.mono{font-family:Consolas,monospace;font-size:12.5px}
ul.k{margin:6px 0 0;padding-left:20px}
</style>
</head>
<body>
<header><h1>LV-Tool</h1><span class="pfad" id="hpfad"></span><button onclick="dlgApp()">App-Einstellungen</button><button id="bWurzel">Eingangsordner ändern</button></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<script>
const T="__TOKEN__";
let Z=null,K=null,E=null,TAB="uebersicht",STAND=null,WACHE=true,VKEY=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(name,data){
  const r=await fetch("/api/"+name,{method:data===undefined?"GET":"POST",headers:{"X-Token":T,"Content-Type":"application/json"},body:data===undefined?undefined:JSON.stringify(data)});
  const j=await r.json(); if(!r.ok) throw new Error(j.fehler||"Fehler"); return j;
}
function toast(msg,fehler){const t=$("#toast");t.textContent=msg;t.className=fehler?"fehler":"";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",fehler?9000:3500);}
async function versuch(fn){try{return await fn();}catch(e){toast(e.message,true);}}

async function laden(){Z=await api("zustand");$("#hpfad").textContent=Z.wurzel||"";nav();if(!Z.wurzel)start();else if(!K)leer();}
function start(){$("#nav").innerHTML="";$("#main").innerHTML=`<div class="start card"><h2>Willkommen</h2><p class="sub">Wählen Sie den Eingangsordner. Darin liegt je Semester ein Ordner und darin je Lehrveranstaltung ein Unterordner. Die App legt dort zusätzlich die Ordner „_profile“ und „_vorlagen“ an.</p><p><button class="pri" onclick="wurzelWaehlen()">Eingangsordner wählen</button></p><p class="sub">oder Pfad eingeben:</p><p class="zeile" style="justify-content:center"><input id="wpfad" size="50" placeholder="C:\\Users\\…\\Documents\\Lehre\\Eingang"><button onclick="wurzelSetzen($('#wpfad').value)">Übernehmen</button></p></div>`;}
async function wurzelWaehlen(){const r=await versuch(()=>api("ordner_waehlen",{}));if(r&&r.pfad)wurzelSetzen(r.pfad);else if(!r){const p=prompt("Pfad des Eingangsordners:");if(p)wurzelSetzen(p);}}
async function wurzelSetzen(p){if(!p)return;await versuch(async()=>{Z=await api("wurzel",{pfad:p});K=null;E=null;$("#hpfad").textContent=Z.wurzel;nav();leer();toast("Eingangsordner eingerichtet.");});}
$("#bWurzel").onclick=wurzelWaehlen;

function nav(){if(!Z||!Z.wurzel){$("#nav").innerHTML="";return;}
  let h="";for(const s of Z.semester){h+=`<div class="sem">${esc(s.name)}${s.abgeschlossen?" · abgeschlossen":""}<a class="semlink" data-s="${esc(s.pfad)}">${s.abgeschlossen?"öffnen":"abschließen"}</a></div>`;for(const k of s.kurse)h+=`<a class="${K===k.pfad?"akt":""}" data-p="${esc(k.pfad)}">${esc(k.name)}${k.offen?`<span class="badge">${k.offen}</span>`:""}<small>${k.eingerichtet?esc(k.profil):"noch nicht eingerichtet"}</small></a>`;if(!s.kurse.length)h+=`<a style="color:var(--mut);cursor:default">keine Lehrveranstaltung</a>`;}
  if(!Z.semester.length)h+=`<div class="leer">Noch kein Semester.</div>`;
  h+=`<div class="neu"><button onclick="dlgKurs()">＋ Lehrveranstaltung</button><button onclick="dlgSemester()">＋ Semester</button></div>`;
  $("#nav").innerHTML=h;document.querySelectorAll("nav a[data-p]").forEach(a=>a.onclick=()=>waehle(a.dataset.p));document.querySelectorAll("nav a[data-s]").forEach(a=>a.onclick=()=>dlgSemesterAbschluss(a.dataset.s));}
function leer(){$("#main").innerHTML=`<div class="leer">Links eine Lehrveranstaltung wählen oder neu anlegen.</div>`;}
function kursInfo(p){for(const s of Z.semester)for(const k of s.kurse)if(k.pfad===p)return {...k,semester:s.name};return null;}

async function waehle(p){K=p;E=null;VKEY=null;STAND=null;nav();const k=kursInfo(p);if(!k.eingerichtet){einrichten(k);return;}
  const sem=Z.semester.find(s=>s.name===k.semester);if(sem.abgeschlossen){$("#main").innerHTML=`<h2>${esc(k.titel||k.name)}</h2><div class="sub">${esc(k.semester)} · ${esc(k.name)}</div><div class="hinweis">Das Semester ${esc(k.semester)} ist abgeschlossen. Die Originaldateien liegen unverändert im Ordner. <button class="klein" onclick="oeffne(K)">Ordner öffnen</button> <button class="klein" onclick="semOeffnen('${esc(sem.pfad).replace(/\\/g,"\\\\")}')">Semester wieder öffnen</button></div>`;return;}
  TAB="uebersicht";await rechnen();}
async function rechnen(still){if(!K)return;if(!still)$("#main").innerHTML=`<div class="leer">Verarbeite …</div>`;const r=await versuch(()=>api("verarbeiten",{pfad:K}));if(r){E=r;zeige();if(E.neu_studenten.length)toast(`Neu auf der Teilnehmerliste: ${E.neu_studenten.join("; ")}`);const a=await api("aenderung",{pfad:K});STAND=a.stand;}else if(!still){$("#main").innerHTML=kopf()+`<div class="hinweis fehler">Die Verarbeitung ist fehlgeschlagen. Bitte die Einstellungen prüfen.</div><div id="inh"></div>`;TAB="einstellungen";tabEinstellungen();}}

function kopf(){const k=kursInfo(K);const n=E?E.offen.length:0;const w=E?E.warnungen.length+E.kontrolle.length:0;
  const tabs=[["uebersicht","Übersicht"],["klaerungen","Klärungen"+(n?`<span class="badge">${n}</span>`:"")],["ergebnisse","Ergebnisse"],["ablage","Ablage"+(E&&E.studenten.some(s=>s.abgelegt)?` (${E.studenten.filter(s=>s.abgelegt).length})`:"")],["entwuerfe","E-Mail-Entwürfe"],["protokoll","Protokoll"+(w?`<span class="badge">${w}</span>`:"")],["bewertung","Bewertung"],["einstellungen","Einstellungen"]];
  return `<h2>${esc(k.titel||k.name)}</h2><div class="sub">${esc(k.semester)} · ${esc(k.name)}${E?" · Profil "+esc(E.profil):""}</div><div class="tabs">${tabs.map(t=>`<a class="${TAB===t[0]?"akt":""}" onclick="tab('${t[0]}')">${t[1]}</a>`).join("")}</div>`;}
function tab(t){TAB=t;zeige();}
function zeige(){$("#main").innerHTML=kopf()+`<div id="inh"></div>`;({uebersicht:tabUebersicht,klaerungen:tabKlaerungen,ergebnisse:tabErgebnisse,entwuerfe:tabEntwuerfe,protokoll:tabProtokoll,bewertung:tabBewertung,ablage:tabAblage,einstellungen:tabEinstellungen})[TAB]();}

function tabUebersicht(){const n=E.offen.length;
  let h=`<div class="kacheln"><div class="kachel"><b>${E.studenten.filter(s=>!s.abgelegt).length}</b><span>Studenten${E.studenten.some(s=>s.abgelegt)?` (+${E.studenten.filter(s=>s.abgelegt).length} in Ablage)`:""}</span></div><div class="kachel"><b>${E.termine.length}</b><span>Termine${E.termine_spaeter.length?` (+${E.termine_spaeter.length} ausstehend)`:""}</span></div><div class="kachel ${n?"warn":"ok"}"><b>${n}</b><span>offene Klärungen</span></div><div class="kachel ${E.kontrolle.length?"warn":"ok"}"><b>${E.kontrolle.length}</b><span>Abweichungen zu Ihren Listen</span></div><div class="kachel ${E.warnungen.length?"warn":"ok"}"><b>${E.warnungen.length}</b><span>Warnungen</span></div></div>`;
  if(!E.studenten.length)h+=`<div class="hinweis">Noch keine offizielle Studentenliste erkannt. Legen Sie die Listen der Universität unverändert in den Ordner der Lehrveranstaltung und das Logbuch in den Semesterordner.</div>`;
  if(!E.teile.length)h+=`<div class="hinweis">Für diese Lehrveranstaltung sind noch keine Teilleistungen festgelegt. <button class="klein" onclick="tab('bewertung')">Bewertung festlegen</button></div>`;
  if(n)h+=`<div class="hinweis">${n} Fälle brauchen Ihre Entscheidung. <button class="klein" onclick="tab('klaerungen')">Zu den Klärungen</button></div>`;
  h+=`<div class="card"><b>Dateien</b><p class="sub" style="margin:4px 0 10px">Listen der Universität und Ihre Punktelisten gehören zur Lehrveranstaltung. Das Logbuch gehört zum Semester und gilt für alle Lehrveranstaltungen dieses Semesters; es muss nur einmal hinzugefügt werden.</p><div class="zeile"><button onclick="$('#up_kurs').click()">Listen für diese Lehrveranstaltung hinzufügen …</button><button onclick="$('#up_sem').click()">Logbuch für das Semester hinzufügen …</button><input type="file" id="up_kurs" multiple hidden accept=".csv,.xlsx,.xlsm,.xml,.txt,.tsv" onchange="hochladen(this,'kurs')"><input type="file" id="up_sem" multiple hidden accept=".csv,.xlsx,.xlsm,.xml,.txt,.tsv" onchange="hochladen(this,'semester')"></div></div>`;
  h+=`<div class="card"><div class="zeile"><button class="pri" onclick="rechnen()">Neu verarbeiten</button><button onclick="oeffne(E.master)">Masterliste öffnen</button><button onclick="oeffne(K)">Ordner der Lehrveranstaltung öffnen</button><span class="sub" style="margin:0 0 0 auto">${Z.ueberwachen?"Neue Dateien werden automatisch verarbeitet.":"Automatische Verarbeitung ist ausgeschaltet."}</span></div></div>`;
  h+=`<div class="card"><button class="klein" style="float:right" onclick="tab('bewertung')">Bewertung bearbeiten</button><b>Bewertungsprofil ${esc(E.profil)}</b> – ${esc(E.profil_bezeichnung)}<table style="margin-top:8px"><tr><th>Teilleistung</th><th>Höchstpunkte</th></tr>${E.teile.map(t=>`<tr><td>${esc(t.name)} <span class="mono" style="color:var(--mut)">${esc(t.id)}</span></td><td>${t.max??"Zusatz"}</td></tr>`).join("")}</table>${E.zu_bestaetigen.length?`<p style="margin:10px 0 0"><b>Noch von Ihnen zu bestätigen:</b></p><ul class="k">${E.zu_bestaetigen.map(z=>`<li>${esc(z)}</li>`).join("")}</ul>`:""}</div>`;
  $("#inh").innerHTML=h;}

function tabKlaerungen(){if(!E.offen.length){$("#inh").innerHTML=`<div class="leer">Keine offenen Klärungen.</div>`;return;}
  let h=`<div class="zeile" style="margin-bottom:10px"><span class="sub" style="margin:0">Ein Klick auf eine Antwort speichert sie dauerhaft. Antworten lassen sich unter „Protokoll“ zurücknehmen.</span><button style="margin-left:auto" onclick="rechnen()">Antworten anwenden und neu verarbeiten</button></div>`;
  E.offen.forEach((q,i)=>{h+=`<div class="card frage" id="q${i}"><span class="kat">${q.kategorie==="struktur"?"einmalige Zuordnung":q.kategorie==="termin"?"Termin":q.kategorie==="liste"?"Teilnehmerliste":"Einzelfall"}</span><p>${esc(q.frage)}</p><div class="opt">${q.optionen.map((o,j)=>`<button onclick="antworte(${i},${j})">${esc(o[1])}</button>`).join("")}${q.freitext?`<input id="ft${i}" size="6" placeholder="Zahl"><button onclick="antworte(${i},-1)">übernehmen</button>`:""}</div></div>`;});
  $("#inh").innerHTML=h;}
let BEANTWORTET=0;
async function antworte(i,j){const q=E.offen[i];const wert=j<0?$("#ft"+i).value.trim():q.optionen[j][0];if(wert==="")return;
  const r=await versuch(()=>api("antwort",{pfad:K,id:q.id,wert}));if(!r)return;$("#q"+i).remove();BEANTWORTET++;
  if(!document.querySelector(".frage")){BEANTWORTET=0;await rechnen(true);if(E.offen.length)toast(`Es sind ${E.offen.length} Folgefragen entstanden.`);else toast("Alle Klärungen erledigt.");}}

function pill(s){const c=/endg/.test(s)?"ok":/vorl/.test(s)?"warn":/ausgest|unbeurt/.test(s)?"":"";return `<span class="pill ${c}">${esc(s)}</span>`;}
function zelle(s,t){const x=s.teile[t.id];const c=x.positiv===false?"neg":(x.status!=="ok"&&!t.zusatz?"off":"");
  if(t.typ==="manuell"&&!s.abgelegt)return `<td class="z ${c}"><input type="text" inputmode="decimal" style="width:64px;text-align:right" value="${esc(x.wert)}" placeholder="–" onchange="setzeManuell('${esc(s.key)}','${esc(t.id)}',this.value)"></td>`;
  return `<td class="z ${c}" title="${esc(x.status)}">${x.wert!==""?esc(x.wert):(t.zusatz?"":esc(x.status))}</td>`;}
async function setzeManuell(key,tid,wert){const r=await versuch(()=>api("manuell",{pfad:K,key,tid,wert}));if(r){E=r;zeige();}else zeige();}
async function ablage(key,ablegen){const r=await versuch(()=>api("ablage",{pfad:K,key,ablegen}));if(r){E=r;await laden();zeige();toast(ablegen?"In die Ablage verschoben. Die Daten bleiben erhalten.":"Aus der Ablage zurückgeholt.");}}
function tabAblage(){const ab=E.studenten.filter(s=>s.abgelegt);
  let h=`<p class="sub">Studenten in der Ablage erscheinen nicht mehr in Ergebnissen, Masterliste und E-Mail-Entwürfen. Ihre Daten bleiben vollständig dokumentiert (auch im Blatt „Ablage“ der Masterliste) und werden weiter aktualisiert. Rückfragen zu ihnen stellt die App nicht mehr.</p>`;
  if(!ab.length){$("#inh").innerHTML=h+`<div class="leer">Die Ablage ist leer. Studenten lassen sich im Reiter „Ergebnisse“ in die Ablage verschieben.</div>`;return;}
  h+=`<div class="tabelle"><table><tr><th>Student</th><th>Matrikelnr.</th><th>E-Mail</th>${E.teile.map(t=>`<th>${esc(t.name)}${t.max!=null?` (${t.max})`:""}</th>`).join("")}<th>Summe</th><th>Anwesend</th><th>Fehltermine</th><th>Mitarbeit</th><th></th></tr>`;
  for(const s of ab)h+=`<tr><td><b>${esc(s.nachname)}</b>, ${esc(s.vorname)}${s.nicht_aktuell?`<br><small style="color:var(--mut)">nicht mehr auf der aktuellen Teilnehmerliste</small>`:""}</td><td class="mono">${esc(s.matrikel)}</td><td>${esc(s.email)}</td>${E.teile.map(t=>zelle(s,t)).join("")}<td class="z"><b>${esc(s.summe)}</b></td><td class="z">${s.anwesend}</td><td class="z">${s.abwesend}</td><td class="z">${s.mitarbeit}</td><td><button class="klein" onclick="ablage('${esc(s.key)}',false)">zurückholen</button></td></tr>`;
  $("#inh").innerHTML=h+`</table></div>`;}
function tabErgebnisse(){const aktive=E.studenten.filter(s=>!s.abgelegt);if(!aktive.length){$("#inh").innerHTML=`<div class="leer">Keine Studenten.</div>`;return;}
  const sw=Object.entries(Z.status_werte);
  let h=`<div class="tabelle"><table><tr><th>Student</th><th>Matrikelnr.</th>${E.teile.map(t=>`<th title="${esc(t.id)}">${esc(t.name)}${t.max!=null?` (${t.max})`:""}</th>`).join("")}<th>Summe</th><th>Note</th><th>Status</th><th>Fehltermine</th><th>Mitarbeit</th><th>Status festlegen</th><th></th></tr>`;
  for(const s of aktive){h+=`<tr><td><b>${esc(s.nachname)}</b>, ${esc(s.vorname)}${s.hinweise.length?`<br><small style="color:var(--mut)">${s.hinweise.map(esc).join(" ")}</small>`:""}</td><td class="mono">${esc(s.matrikel)}</td>`;
    for(const t of E.teile)h+=zelle(s,t);
    h+=`<td class="z"><b>${esc(s.summe)}</b></td><td><b>${esc(s.note)}</b></td><td>${pill(s.status)}</td><td class="z">${s.abwesend}</td><td class="z">${s.mitarbeit}</td><td><select onchange="setzeStatus('${esc(s.key)}',this.value)"><option value="">automatisch</option>${sw.map(([k,v])=>`<option value="${k}" ${s.status_override===k?"selected":""}>${esc(v)}</option>`).join("")}</select></td><td><button class="klein" title="Aus Ergebnissen und E-Mails herausnehmen; die Daten bleiben dokumentiert" onclick="ablage('${esc(s.key)}',true)">in die Ablage</button></td></tr>`;}

function tlZeile(t){const tr=document.createElement("tr");const pos=typeof t.positiv==="number"?"zahl":(t.positiv||"anteil");const sp=(t.typ==="liste"||!t.typ?t.spalten:t.kontrolle)||[];

function profilLesen(){const liste=s=>s.split(",").map(x=>x.trim()).filter(Boolean);const num=v=>v===""?null:parseFloat(v);const p={...P};

function einrichten(k){$("#main").innerHTML=`<h2>${esc(k.name)}</h2><div class="sub">${esc(k.semester)} · Ordner vorhanden, aber noch nicht eingerichtet</div><div class="card">${kursForm(k.semester,k.name,true)}<div class="zeile" style="margin-top:14px"><button class="pri" onclick="kursAnlegen()">Einrichten</button></div></div>`;}
function kursForm(sem,name,fest){const alle=Z.semester.flatMap(s=>s.kurse.filter(k=>k.eingerichtet).map(k=>({...k,sem:s.name})));
  return `<form class="f" onsubmit="return false"><label>Semester</label>${fest?`<input id="n_sem" value="${esc(sem)}" readonly>`:`<select id="n_sem">${Z.semester.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select>`}<label>Ordnername der Lehrveranstaltung</label><input id="n_name" value="${esc(name||"")}" ${fest?"readonly":""} placeholder="z. B. JAT_EDV"><label>Kopie des Vorsemesters</label><select id="n_von" onchange="document.querySelectorAll('.nurneu').forEach(e=>e.disabled=!!this.value)"><option value="">(keine – neu anlegen)</option>${alle.map(k=>`<option value="${esc(k.pfad)}">${esc(k.sem)} / ${esc(k.name)}</option>`).join("")}</select><small>Die Kopie übernimmt Profil, Vorlage und Listenzuordnungen, aber keine personenbezogenen Entscheidungen.</small><label>Bewertungsprofil</label><select id="n_profil" class="nurneu"><option value="__neu__">(neues, leeres Bewertungsprofil)</option>${Z.profile.map(p=>`<option value="${esc(p.id)}">${esc(p.id)} – ${esc(p.bezeichnung)}</option>`).join("")}</select><label>Titel</label><input id="n_titel" class="nurneu" placeholder="z. B. JAT &amp; EDV"><label>Kürzel im Logbuch</label><input id="n_log" class="nurneu" placeholder="z. B. JAT"><label>Report-Vorlage</label><select id="n_vorlage" class="nurneu"><option value="">(keine)</option>${Z.vorlagen.map(v=>`<option>${esc(v)}</option>`).join("")}</select></form>`;}
function dlgKurs(){if(!Z.semester.length){dlgSemester();return;}$("#dlg").innerHTML=`<h2>Neue Lehrveranstaltung</h2><div class="sub">Legt den Ordner an. Danach die Listen der Universität hineinlegen.</div>${kursForm("", "", false)}<div class="zeile" style="margin-top:16px;justify-content:flex-end"><button onclick="$('#dlg').close()">Abbrechen</button><button class="pri" onclick="kursAnlegen()">Anlegen</button></div>`;$("#dlg").showModal();}
async function kursAnlegen(){const d={semester:$("#n_sem").value,name:$("#n_name").value,von:$("#n_von").value,profil:$("#n_von").value?"":$("#n_profil").value,lv_titel:$("#n_von").value?"":$("#n_titel").value,logbuch_lv:$("#n_von").value?"":$("#n_log").value,vorlage:$("#n_von").value?"":$("#n_vorlage").value};
  if(!d.name.trim()){toast("Bitte einen Ordnernamen eingeben.",true);return;}
  const r=await versuch(()=>api("kurs_anlegen",d));if(r){Z=r;if($("#dlg").open)$("#dlg").close();const s=Z.semester.find(s=>s.name===d.semester);const k=s.kurse.find(k=>k.name===d.name.trim());await waehle(k.pfad);toast("Lehrveranstaltung angelegt.");}}
function dlgSemester(){$("#dlg").innerHTML=`<h2>Neues Semester</h2><form class="f" onsubmit="return false"><label>Ordnername</label><input id="s_name" placeholder="z. B. 2026W"></form><div class="zeile" style="margin-top:16px;justify-content:flex-end"><button onclick="$('#dlg').close()">Abbrechen</button><button class="pri" onclick="semAnlegen()">Anlegen</button></div>`;$("#dlg").showModal();}
async function semAnlegen(){const r=await versuch(()=>api("semester_anlegen",{name:$("#s_name").value}));if(r){Z=r;nav();$("#dlg").close();}}
function dlgProfil(){$("#dlg").innerHTML=`<h2>Profil kopieren</h2><div class="sub">Die Kopie liegt danach im Profilordner und kann dort angepasst werden.</div><form class="f" onsubmit="return false"><label>Vorlage</label><select id="p_alt">${Z.profile.map(p=>`<option>${esc(p.id)}</option>`).join("")}</select><label>Neuer Name</label><input id="p_neu" placeholder="z. B. JAT_EDV_2026-27"></form><div class="zeile" style="margin-top:16px;justify-content:flex-end"><button onclick="$('#dlg').close()">Abbrechen</button><button class="pri" onclick="profilKopieren()">Kopieren</button></div>`;$("#dlg").showModal();}
async function profilKopieren(){const r=await versuch(()=>api("profil_kopieren",{alt:$("#p_alt").value,neu:$("#p_neu").value.trim()}));if(r){$("#dlg").close();await laden();if(TAB==="einstellungen")tabEinstellungen();toast("Profil kopiert.");}}
async function hochladen(inp,ziel){let n=0;for(const f of inp.files){const send=async ers=>{const r=await fetch(`/api/hochladen?pfad=${encodeURIComponent(K)}&ziel=${ziel}&name=${encodeURIComponent(f.name)}&ersetzen=${ers?1:0}`,{method:"POST",headers:{"X-Token":T},body:f});const j=await r.json();if(!r.ok)throw new Error(j.fehler);return j;};
    try{let j=await send(false);if(j.status==="vorhanden"){if(confirm(`„${f.name}“ gibt es im Ordner bereits mit anderem Inhalt. Durch die neue Fassung ersetzen?`))j=await send(true);else continue;}if(j.status!=="unveraendert")n++;}catch(e){toast(e.message,true);}}
  inp.value="";if(n){await rechnen();toast(`${n} Datei(en) hinzugefügt und verarbeitet.`);}else toast("Keine neuen Dateien.");}
function dlgApp(){$("#dlg").innerHTML=`<h2>App-Einstellungen</h2><p><label><input type="checkbox" id="a_wache" ${Z.ueberwachen?"checked":""}> Eingangsordner überwachen: neue oder geänderte Dateien aller Lehrveranstaltungen offener Semester automatisch verarbeiten</label></p><p><label><input type="checkbox" id="a_auto" ${Z.autostart?"checked":""} ${Z.autostart_moeglich?"":"disabled"}> Mit Windows starten und im Hintergrund überwachen (ohne Fenster; ein Doppelklick auf LV-Tool öffnet das Fenster)</label>${Z.autostart_moeglich?"":`<br><small class="sub">Nur in der Windows-App (LV-Tool.exe) verfügbar.</small>`}</p><p class="sub">Version ${esc(Z.version)}</p><div class="zeile" style="margin-top:16px;justify-content:flex-end"><button onclick="appBeenden()">App vollständig beenden</button><button onclick="$('#dlg').close()">Abbrechen</button><button class="pri" onclick="appSpeichern()">Speichern</button></div>`;$("#dlg").showModal();}
async function appSpeichern(){const d={ueberwachen:$("#a_wache").checked};if(Z.autostart_moeglich)d.autostart=$("#a_auto").checked;const r=await versuch(()=>api("app_einstellungen",d));if(r){Z=r;$("#dlg").close();if(E)zeige();toast("Gespeichert.");}}
async function appBeenden(){try{await api("beenden",{});}catch(e){}document.body.innerHTML=`<div class="leer">LV-Tool wurde beendet. Dieses Fenster kann geschlossen werden.</div>`;window.close();}
async function dlgSemesterAbschluss(pfad){const u=await versuch(()=>api("semester_uebersicht",{pfad}));if(!u)return;
  if(u.abgeschlossen){if(confirm(`Semester ${u.semester} wieder öffnen?`))semOeffnen(pfad);return;}
  $("#dlg").innerHTML=`<h2>Semester ${esc(u.semester)} abschließen</h2><table><tr><th>Lehrveranstaltung</th><th>Ergebnisdateien</th><th>Einzelentscheidungen</th><th>Originaldateien</th></tr>${u.kurse.map(k=>`<tr><td>${esc(k.name)}</td><td class="z">${k.ergebnisdateien}</td><td class="z">${k.entscheidungen_person}</td><td class="z">${k.originale}</td></tr>`).join("")}</table><p class="sub" style="margin-top:10px">Originaldateien werden nie gelöscht. Ergebnisse sind Masterliste, Entwürfe, Serienbrief-Dateien und Ihre Einzelentscheidungen. Bewertung, Vorlage und Listenzuordnungen bleiben für die Kopie ins nächste Semester erhalten.</p><p><label><input type="checkbox" id="x_arch" checked> Ergebnisse vorher als ZIP-Archiv sichern</label><br><label style="margin-left:22px"><input type="checkbox" id="x_orig"> Originaldateien in das Archiv aufnehmen</label><br><span style="margin-left:22px">Zielordner: <input id="x_ziel" size="38" placeholder="leer = Semesterordner"> <button class="klein" onclick="zielWaehlen()">wählen …</button></span></p><p><label><input type="radio" name="x_art" value="behalten" checked> Ergebnisse im Ordner behalten</label><br><label><input type="radio" name="x_art" value="loeschen"> Ergebnisse und Einzelentscheidungen löschen</label></p><p class="sub">Das Archiv ist nicht verschlüsselt. Für eine verschlüsselte Sicherung einen verschlüsselten Zielordner wählen.</p><div class="zeile" style="margin-top:16px;justify-content:flex-end"><button onclick="$('#dlg').close()">Abbrechen</button><button class="pri" onclick="semAbschliessen('${esc(pfad).replace(/\\/g,"\\\\")}')">Semester abschließen</button></div>`;$("#dlg").showModal();}
async function zielWaehlen(){const r=await versuch(()=>api("ordner_waehlen",{}));if(r&&r.pfad)$("#x_ziel").value=r.pfad;}
async function semAbschliessen(pfad){const loeschen=document.querySelector("input[name=x_art]:checked").value==="loeschen";
  if(loeschen&&!$("#x_arch").checked&&!confirm("Ergebnisse ohne Archiv endgültig löschen?"))return;
  let msg="";if($("#x_arch").checked){const a=await versuch(()=>api("semester_archivieren",{pfad,ziel:$("#x_ziel").value.trim(),originale:$("#x_orig").checked}));if(!a)return;msg=`Archiv: ${a.datei} (${a.anzahl} Dateien). `;}
  const r=await versuch(()=>api("semester_abschliessen",{pfad,loeschen}));if(r){Z=r;$("#dlg").close();K=null;E=null;nav();leer();toast(msg+"Semester abgeschlossen.");}}
async function semOeffnen(pfad){const r=await versuch(()=>api("semester_oeffnen",{pfad}));if(r){Z=r;nav();if(K)waehle(K);toast("Semester wieder geöffnet.");}}
async function oeffne(p){await versuch(()=>api("oeffnen",{pfad:p}));}

let NEU_GEMELDET="";
setInterval(async()=>{try{await api("puls",{});const z=await api("zustand");if(Z&&JSON.stringify(z.semester)!==JSON.stringify(Z.semester)&&!$("#dlg").open){Z=z;nav();}
  if(K&&E&&Z.ueberwachen&&!$("#dlg").open&&!BEANTWORTET&&!EDIT){const a=await api("aenderung",{pfad:K});if(STAND!==null&&a.stand!==STAND&&TAB!=="einstellungen"&&TAB!=="bewertung"){STAND=a.stand;{await rechnen(true);toast("Neue oder geänderte Dateien verarbeitet.");}}}}catch(e){}},20000);
laden().catch(e=>toast(e.message,true));
</script>
</body>
</html>
